name: Repack verified Generals X 1.0.5.11 draft

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing v1.0.5.11 draft release ID
        required: true
        type: string
      input_asset_id:
        description: Verified CI input asset ID on that draft
        required: true
        type: string
      input_sha256:
        description: Locally verified CI input archive SHA256
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: generalsx-repack-v1.0.5.11
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository == 'juanm-builder/GeneralsX-Updates'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out reviewed release scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconstruct, verify, package, and upload to draft only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          INPUT_ASSET_ID: ${{ inputs.input_asset_id }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          python3 ci/repack_release.py \
            --work "$RUNNER_TEMP/generalsx-repack-1.0.5.11" \
            --release-id "$RELEASE_ID" \
            --input-asset-id "$INPUT_ASSET_ID" \
            --input-sha256 "$INPUT_SHA256"
